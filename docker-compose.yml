services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      {
        POSTGRES_USER: documents,
        POSTGRES_PASSWORD: documents,
        POSTGRES_DB: documents,
      }
    ports: ["5433:5432"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U documents"],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }
  mongodb:
    image: mongo:8
    ports: ["27017:27017"]
    healthcheck:
      {
        test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"],
        interval: 10s,
        timeout: 5s,
        retries: 10,
      }
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      { MINIO_ROOT_USER: documents, MINIO_ROOT_PASSWORD: documents-secret }
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      {
        test: ["CMD", "mc", "ready", "local"],
        interval: 10s,
        timeout: 5s,
        retries: 10,
      }
